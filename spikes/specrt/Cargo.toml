[package]
name = "specrt"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
anyhow = "1"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
dirs = "6"
memmap2 = "0.9"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[profile.dev]
opt-level = 3
