[package]
name = "bench-suite"
description = "Installs, updates and launches the bench tools: gcad, agentee, printfarm, antenna toolbox, waveshark, radio_tool, thermview, battery control, cycler, testbench, coldbench and ngrind, and runs a coding agent that uses them"
version = "0.8.4"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/bench-suite"

[dependencies]
dirs = "6"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
    "wayland",
    "x11",
    "clipboard",
    "links",
] }
egui = "0.37"
egui_bench = { version = "0.9.2", features = ["update", "agent", "sandbox"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

