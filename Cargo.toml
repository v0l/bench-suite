[package]
name = "bench-suite"
description = "Installs, updates and launches the bench tools: gcad, agentee, printfarm, antenna toolbox, waveshark, radio_tool, thermview, battery control and cycler, and runs a coding agent that uses them"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/v0l/bench-suite"

[dependencies]
dirs = "6"
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_bench = { version = "0.5.4", features = ["update", "agent", "sandbox"] }
egui_extras = { version = "0.35", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

