[package]
name = "bench-suite"
description = "Installs, updates and launches the bench tools: gcad, agentee, antenna toolbox, thermview, cycler and waveshark"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/v0l/bench-suite"

[dependencies]
dirs = "6"
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_bench = { git = "https://github.com/v0l/egui_bench", features = ["update"] }
egui_extras = { version = "0.35", default-features = false, features = ["svg"] }

[profile.release]
opt-level = 3
lto = "thin"
